spring:
  application:
    name: api-stric
  profiles:
    active: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

server:
  port: ${PORT:${SERVER_PORT:8081}}
  error:
    include-message: always
    include-binding-errors: always

# Configurações do JWT
jwt:
  # Chave secreta HMAC-SHA de pelo menos 256 bits (32+ caracteres)
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Expiração em milissegundos (ex: 86400000 = 24 horas)
  expiration: 86400000

# Armazenamento de Arquivos Local Seguro
storage:
  upload-dir: ${STORAGE_UPLOAD_DIR:./storage/uploads/curriculos}

# Integração com Inteligência Artificial (Google Gemini)
ai:
  gemini:
    # A chave da API é carregada EXCLUSIVAMENTE por variável de ambiente.
    # Nunca insira a chave diretamente neste arquivo.
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
    timeout-seconds: 45

# Configuração do Tesseract OCR para PDFs escaneados
ocr:
  tessdata-path: ${TESSDATA_PREFIX:./tessdata}
  language: ${OCR_LANGUAGE:por+eng}

# Documentação OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Configurações de CORS
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://stric-web.vercel.app,https://stric-5a5a6i1m9-nicholas-e47c.vercel.app,https://*.vercel.app,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8081,*}

