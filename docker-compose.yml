services:
  postgres:
    image: postgres:16-alpine
    container_name: stric-postgres
    environment:
      POSTGRES_DB: stric_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
